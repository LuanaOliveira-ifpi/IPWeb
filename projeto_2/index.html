<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary">
                <i class="fas fa-clock"></i> Pedidos Recentes
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Enviar Cliente
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-dollar-sign"></i> Receber Pagamento
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-list-alt"></i> Todos os Pedidos
            </button>
            <button class="btn btn-primary" data-toggle="modal" data-target="#janela">
                <i class="fas fa-plus"></i> Novo Pedido
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-home"></i> Página Principal
            </button>
        </div>
        
        <div class="mb-4">
            <div class="row pesquisar">
                <div class="col-md-10">
                    <h4>Pesquisa de Produtos</h4>
                </div>
                <div class="col-md-2">
                    <div>
                        <button type="button" class="btn btn-default btn-sm mr-2">
                            <i class="fas fa-window-minimize"></i>
                        </button>
                        <button type="button" class="btn btn-default btn-sm">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="col-12">
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <input type="text" class="form-control" id="descricao" placeholder="Digite a descrição do produto">
                    </div>
                    <button class="btn btn-primary">
                        <i class="fas fa-search me-1"></i> Pesquisar
                    </button>
                    <button class="btn btn-warning">
                        <i class="fas fa-sync-alt me-1"></i> Recarregar
                    </button>
                    <button class="btn btn-success" data-toggle="modal" data-target="#janela">
                        <i class="fas fa-plus-circle me-1"></i> Novo
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal para novo produto -->
        <div class="modal fade" id="janela" tabindex="-1" aria-labelledby="janelaLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="janelaLabel">Novo Produto</h4>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="form-group">
                                <label for="nome" class="form-label">Nome do produto:</label>
                                <input type="text" placeholder="Digite o nome do produto" class="form-control" id="nome">
                            </div>
                            <div class="form-group">
                                <label for="preco" class="form-label">Preço:</label>
                                <input type="number" placeholder="Digite o preço do produto" class="form-control" id="preco">
                            </div>
                            <div class="form-group">
                                <label for="categoria" class="form-label">Categoria:</label>
                                <input type="text" class="form-control" id="categoria" placeholder="Digite a categoria do produto">
                            </div>
                            <div class="form-group">
                                <label for="situacao" class="form-label">Situação</label>
                                <select class="form-control" id="situacao">
                                    <option>Ativo</option>
                                    <option>Inativo</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Opções de pesquisa e registro -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center">
                <label for="numeroporpagina" class="mr-2 mb-0">Registros por página</label>
                <select id="numeroporpagina" class="form-control d-inline-block w-auto mr-2" name="registrosPorPagina">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>
            <div class="d-flex align-items-center">
                <label for="search" class="mr-2 mb-0">Busca:</label>
                <input type="text" id="search" class="form-control w-auto" placeholder="Digite para buscar...">
            </div>
        </div>

        <!-- Tabela de produtos -->
        <div class="container mt-5">
            <table class="table table-striped table-hover table-condensed">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Situação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Pizza</td>
                        <td><span class="badge badge-success">Ativo</span></td>
                        <td>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Ver Detalhes"><i class="fas fa-list-alt"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Editar"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Remover" onclick="confirmDelete()"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Refrigerante</td>
                        <td><span class="badge badge-success">Ativo</span></td>
                        <td>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Ver Detalhes"><i class="fas fa-list-alt"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Editar"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Remover" onclick="confirmDelete()"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Cajuína</td>
                        <td><span class="badge badge-secondary">Inativo</span></td>
                        <td>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Ver Detalhes"><i class="fas fa-list-alt"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Editar"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Remover" onclick="confirmDelete()"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Borda</td>
                        <td><span class="badge badge-success">Ativo</span></td>
                        <td>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Ver Detalhes"><i class="fas fa-list-alt"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Editar"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-secondary btn-sm" data-toggle="tooltip" data-placement="top" title="Remover" onclick="confirmDelete()"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script> var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
  return new bootstrap.Tooltip(tooltipTriggerEl)
}) 
        </script>
</body>
</html>
