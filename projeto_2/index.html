<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary">
                <i class="fas fa-clock"></i> Pedidos Recentes
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Enviar Cliente
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-dollar-sign"></i> Receber Pagamento
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-list-alt"></i> Todos os Pedidos
            </button>
            <button class="btn btn-primary" data-toggle="modal" data-target="#janela">
                <i class="fas fa-plus"></i> Novo Pedido
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-home"></i> Página Principal
            </button>
        </div>
        <div class="mb-4">
            <div class="row pesquisar">
                <div class="col-md-10">
                    <h4>Pesquisa de Produtos</h4>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <input type="text" class="form-control" id="descricao" placeholder="Digite a descrição do produto">
                    </div>
                    <button class="btn btn-primary">
                        <i class="fas fa-search me-1"></i> Pesquisar
                    </button>
                    <button class="btn btn-warning">
                        <i class="fas fa-sync-alt me-1"></i> Recarregar
                    </button>
                    <button class="btn btn-success" data-toggle="modal" data-target="#janela">
                        <i class="fas fa-plus-circle me-1"></i> Novo
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal Novo Produto -->
        <div class="modal fade" id="janela" tabindex="-1" aria-labelledby="janelaLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="janelaLabel">Novo Produto</h4>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="form-group">
                                <label for="nome" class="form-label">Nome do produto:</label>
                                <input type="text" placeholder="Digite o nome do produto" class="form-control" id="nome">
                            </div>
                            <div class="form-group">
                                <label for="preco" class="form-label">Preço:</label>
                                <input type="number" placeholder="Digite o preço do produto" class="form-control" id="preco">
                            </div>
                            <div class="form-group">
                                <label for="categoria" class="form-label">Categoria:</label>
                                <input type="text" class="form-control" id="categoria" placeholder="Digite a categoria do produto">
                            </div>
                            <div class="form-group">
                                <label for="situacao" class="form-label">Situação</label>
                                <select class="form-control" id="situacao">
                                    <option>Ativo</option>
                                    <option>Inativo</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
