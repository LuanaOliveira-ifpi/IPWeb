<!doctype html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary">
                <i class="fas fa-clock"></i> Pedidos Recentes
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Enviar Cliente
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-dollar-sign"></i> Receber Pagamento
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-list-alt"></i> Todos os Pedidos
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-plus"></i> Novo Pedido
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-home"></i> Página Principal
            </button>
        </div>
        <div class="mb-4">
            <div class="row pesquisar">
                <div class="col-md-10">
                    <h4>Pesquisa de Produtos</h4>
            </div>
            </div>
           <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <input type="text" class="form-control" id="descricao" placeholder="Digite a descrição do produto">
      </div>
<button class="btn btn-primary">
        <i class="bi bi-search me-1"></i> Pesquisar
      </button>
      <button class="btn btn-warning">
        <i class="bi bi-arrow-clockwise me-1"></i> Recarregar
      </button>
      <button class="btn btn-success">
        <i class="bi bi-plus-circle me-1"></i> Novo
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      </body>
</html>
