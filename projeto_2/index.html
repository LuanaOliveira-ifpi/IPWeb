<!doctype html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary">
                <i class="fas fa-clock"></i> Pedidos Recentes
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Enviar Cliente
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-dollar-sign"></i> Receber Pagamento
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-list-alt"></i> Todos os Pedidos
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-plus"></i> Novo Pedido
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-home"></i> Página Principal
            </button>
        </div>
        <div class="mb-4">
            <div class="row pesquisar">
                <div class="col-md-10">
                    <h4>Pesquisa de Produtos</h4>
  <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <input type="text" class="form-control" id="descricao" placeholder="Digite a descrição do produto">
      </div>
      <button class="btn btn-primary">
        <i class="bi bi-search me-1"></i> Pesquisar
      </button>
      <button class="btn btn-warning">
        <i class="bi bi-arrow-clockwise me-1"></i> Recarregar
      </button>
      <button class="btn btn-success">
        <i class="bi bi-plus-circle me-1"></i> Novo
      </button>
    </div>

<div class="collapse mt-4" id="novoProdutoForm">
        <div class="card card-body">
          <h5 class="card-title">Novo Produto</h5>
          <form>
            <div class="mb-3">
              <label for="nomeProduto" class="form-label">Nome do Produto</label>
              <input type="text" class="form-control" id="nomeProduto" placeholder="Digite o nome do produto">
            </div>
            <div class="mb-3">
              <label for="precoProduto" class="form-label">Preço</label>
              <input type="text" class="form-control" id="precoProduto" placeholder="Digite o preço do produto">
            </div>
            <div class="mb-3">
              <label for="categoriaProduto" class="form-label">Categoria</label>
              <input type="text" class="form-control" id="categoriaProduto" placeholder="Digite a categoria do produto">
            </div>
            <div class="mb-3">
              <label for="situacaoProduto" class="form-label">Situação</label>
              <select class="form-select" id="situacaoProduto">
                <option selected>Selecione a situação</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
