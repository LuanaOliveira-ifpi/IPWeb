<!DOCTYPE html>
<html>
<head>
    <title> Programação Web </title>
    <meta charset="utf-8"> 
    <link rel="stylesheet" type="text/css" href="normalize.css">
</head>
    <style>
   .box {
      background: #b9c941;
      width: 300px;
      height: 140px;
      padding: 10px;
      margin: 10px;
      border-radius:10px 40px;
     -webkit-border-radius:20px;
     -moz-border-radius:20px;
      box-sizing: border-box;
    }
  fieldset {
            border: 1px solid #8a9d2b; 
            padding: 10px;
            margin: 0;
            border-radius: 5px; 
        }

 input[type="text"] {
            width: 100%; 
            padding: 8px; 
            border: 1px solid #666; 
            border-radius: 5px;
            font-size: 1em; 
        }
 </style>
   <body>
    <div class="box">
      <fieldset>
        <legend>Dados Pessoais</legend>
        <p>Nome: <input type="text" /></p>
        <p>E-mail: <input type="text" /></p>
      </fieldset>
    </div>
  </body>
</html>
