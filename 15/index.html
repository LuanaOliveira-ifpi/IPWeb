<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Atividade 15</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden; 
        }

        .box {
            position: absolute;
            width: 50px;
            height: 50px;
            background: red;
            animation: minhaAnimacao 10s linear infinite;
        }

        @keyframes minhaAnimacao {
            0% {
                transform: rotate(0deg) translate(0, 0);
                background: red;
            }
            25% {
                transform: rotate(90deg) translate(200px, 0);
                background: blue;
            }
            50% {
                transform: rotate(180deg) translate(200px, 200px);
                background: green;
            }
            75% {
                transform: rotate(270deg) translate(0, 200px);
                background: yellow;
            }
            100% {
                transform: rotate(360deg) translate(0, 0);
                background: red;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
