<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Atividade 15</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Garante que não apareçam barras de rolagem */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 50px;
            height: 50px;
            background: red;
            animation: minhaAnimacao 10s linear infinite;
        }

        @keyframes minhaAnimacao {
            0% {
                transform: rotate(0deg);
                background: red;
            }
            25% {
                transform: rotate(90deg);
                background: blue;
            }
            50% {
                transform: rotate(180deg);
                background: green;
            }
            75% {
                transform: rotate(270deg);
                background: yellow;
            }
            100% {
                transform: rotate(360deg);
                background: red;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
