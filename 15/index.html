<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Atividade 15</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="normalize.css">
    <style>
        .box {
            position: relative;
            left: 10px;
            top: 10px;
            width: 50px;
            height: 50px;
            background: red;
            animation: minhaAnimacao 10s infinite;
        }

        @keyframes minhaAnimacao {
            0% {
                background: red;
                transform: rotate(0deg);
            }
            25% {
                background: blue;
                transform: rotate(90deg);
            }
            50% {
                background: green;
                transform: rotate(180deg);
            }
            75% {
                background: yellow;
                transform: rotate(270deg);
            }
            100% {
                background: red;
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
