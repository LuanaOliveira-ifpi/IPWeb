<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de jQuery com Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box {
            height: 100px;
            width: 150px;
            background: #428bca;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .float-start {
            float: left;
            margin-right: 15px;
        }
        .caixa {
            height: 100px;
            width: 100px;
            background: #428bca;
            display: inline-block;
            margin-right: 15px;
        }
        .float-left {
            float: left;
        }
        .text-center {
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="title bg-light text-center">
            <h1>SELECIONANDO ELEMENTOS COM JQUERY</h1>
        </div>

        <hr />

        <div class="row">
            <div class="col-md-4">
                <h4>Parágrafos</h4>
                <p class="bg-primary" id="paragrafo1">Este é um parágrafo</p>
                <p class="bg-success" id="paragrafo2">Este é outro parágrafo</p>
            </div>
            <div class="col-md-4">
                <h4>Divisões</h4>
                <div class="caixa float-left" id="div1"></div>
                <div class="caixa float-left" id="div2"></div>
            </div>
            <div class="col-md-4">
                <h4>Campos</h4>
                <input id="campo1" type="text" placeholder="input ID 01" class="form-control mt-3" />
                <input id="campo2" type="text" placeholder="input ID 02" class="form-control mt-3" />
            </div>
        </div>

        <hr />

        <div class="row">
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('p', 'tag', false)">Esconder parágrafos</button>
                <button type="button" class="btn btn-success" onclick="exibirOcultarGenerica('p', 'tag', true)">Exibir parágrafos</button>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('caixa', 'classe', false)">Esconder divs</button>
                <button type="button" class="btn btn-success" onclick="exibirOcultarGenerica('caixa', 'classe', true)">Exibir divs</button>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('campo1', 'id', false)">Esconder input ID 1</button>
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('campo2', 'id', false)">Esconder input ID 2</button>
                <button type="button" class="btn btn-success mt-3" onclick="exibirOcultarGenerica('campo1', 'id', true)">Exibir input ID 1</button>
                <button type="button" class="btn btn-success mt-3" onclick="exibirOcultarGenerica('campo2', 'id', true)">Exibir input ID 2</button>
            </div>
        </div>   

        <div class="container mt-5">
            <div class="title bg-light text-center">
                <h1>EVENTOS COM JQUERY</h1>
            </div>
            <hr />
            <div class="row">
                <div class="col-md-4">
                    <div class="box bg-primary" id="clickBox">Evento Click</div>
                    <div class="box bg-success" id="clickBox2">Evento Click</div>
                </div>
                <div class="col-md-4">
                    <div class="box bg-primary" id="doubleClickBox">Evento Double Click</div>
                    <div class="box bg-success" id="doubleClickBox2">Evento Double Click</div>
                </div>
                <div class="col-md-4">
                    <div class="box bg-danger" id="hoverBox">Evento Mouseover</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.6/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/javascript">
        function exibirOcultarGenerica(selector, tipo, flag) {
            if (tipo === 'tag') {
                $(selector).toggle(flag);
            } else if (tipo === 'classe') {
                $('.' + selector).toggle(flag);
            } else if (tipo === 'id') {
                $('#' + selector).toggle(flag);
            }
        }

        $("#clickBox, #clickBox2").click(function () {
            $(this).text("Clique detectado!");
        });

        $("#doubleClickBox, #doubleClickBox2").dblclick(function () {
            $(this).text("Duplo Clique Detectado!");
        });

        $("#hoverBox").hover(
            function () {
                $(this).text("Você está sobre a caixa!");
            },
            function () {
                $(this).text("Evento Mouseover");
            }
        );
    </script>
</body>
</html>
