<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manipulação de Elementos com jQuery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* Estilos gerais */
        body {
            background-color: #f8f9fa;
        }

        .container {
            padding: 2rem;
        }

        /* Estilos para as caixas */
        .box {
            height: 150px;
            width: 150px;
            border: 2px solid #ddd;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        /* Estilos específicos para as caixas */
        #toggleElementBox {
            background-color: #ffffff;
            border-color: #ced4da;
        }

        #colorChangeBox {
            background-color: #17a2b8;
            border-color: #17a2b8;
        }

        #clickBox {
            background-color: #6c757d;
            border-color: #6c757d;
        }

        #doubleClickBox {
            background-color: #28a745;
            border-color: #28a745;
        }

        #hoverBox {
            background-color: #ffc107;
            border-color: #ffc107;
        }

        /* Estilos dos botões */
        .btn-dark {
            background-color: #343a40;
            border-color: #343a40;
        }

        /* Estilos dos parágrafos */
        .bg-primary {
            background-color: #007bff;
            color: #ffffff;
        }

        .bg-success {
            background-color: #28a745;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center">Manipulação de Elementos com jQuery</h1>
        <hr />

        <div class="row">
            <div class="col-md-4">
                <h4>Parágrafos</h4>
                <p class="bg-primary text-white p-2" id="paragrafo1">Este é um parágrafo</p>
                <p class="bg-success text-white p-2" id="paragrafo2">Este é outro parágrafo</p>
            </div>
            <div class="col-md-4">
                <h4>Divisões</h4>
                <div class="float-start" id="div1"></div>
                <div class="float-start" id="div2"></div>
            </div>
            <div class="col-md-4">
                <h4>Campos</h4>
                <input id="campo1" type="text" placeholder="input ID 01" class="form-control" />
                <input id="campo2" type="text" placeholder="input ID 02" class="form-control" />
            </div>
        </div>

        <hr />

        <div class="row">
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="toggleElements('p', false)">Esconder parágrafos</button>
                <button type="button" class="btn btn-success" onclick="toggleElements('p', true)">Exibir parágrafos</button>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="toggleDivs(false)">Esconder divs</button>
                <button type="button" class="btn btn-success" onclick="toggleDivs(true)">Exibir divs</button>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="toggleElementById('campo1', false)">Esconder input ID 1</button>
                <button type="button" class="btn btn-danger" onclick="toggleElementById('campo2', false)">Esconder input ID 2</button>
                <button type="button" class="btn btn-success" onclick="toggleElementById('campo1', true)">Exibir input ID 1</button>
                <button type="button" class="btn btn-success" onclick="toggleElementById('campo2', true)">Exibir input ID 2</button>
            </div>
        </div>

        <div class="row justify-content-between mt-4 g-3">
            <div class="col-auto">
                <div class="box" id="toggleElementBox">
                    <p class="text-center">Caixa 1</p>
                </div>
                <button id="toggleElement" class="btn btn-dark mt-2 w-100">Esconder/Mostrar</button>
            </div>
            <div class="col-auto">
                <div class="box" id="colorChangeBox">
                    <p class="text-center">Caixa 2</p>
                </div>
                <button id="colorChange" class="btn btn-dark mt-2 w-100">Alterar Cor</button>
            </div>
            <div class="col-auto">
                <div class="box" id="clickBox">
                    <p class="text-center">Caixa 3</p>
                </div>
                <button id="clickSimple" class="btn btn-dark mt-2 w-100">Clique Simples</button>
            </div>
            <div class="col-auto">
                <div class="box" id="doubleClickBox">
                    <p class="text-center">Caixa 4</p>
                </div>
                <button id="doubleClick" class="btn btn-dark mt-2 w-100">Clique Duplo</button>
            </div>
            <div class="col-auto">
                <div class="box" id="hoverBox">
                    <p class="text-center">Passe o mouse</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.6/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        function toggleElements(tag, flag) {
            if (flag) $(tag).fadeIn('slow');
            else $(tag).fadeOut('slow');
        }

        function toggleDivs(flag) {
            if (flag) $("#div1, #div2").fadeIn('slow');
            else $("#div1, #div2").fadeOut('slow');
        }

        function toggleElementById(id, flag) {
            if (flag) $("#" + id).fadeIn('slow');
            else $("#" + id).fadeOut('slow');
        }

        $("#toggleElement").click(function () {
            $("#toggleElementBox").toggle("slow");
        });

        $("#colorChange").click(function () {
            $("#colorChangeBox").toggleClass("bg-info bg-danger");
        });

        $("#clickSimple").click(function () {
            $("#clickBox").text("Clique detectado!");
        });

        $("#doubleClick").dblclick(function () {
            $("#doubleClickBox").text("Duplo Clique Detectado!");
        });

        $("#hoverBox").hover(
            function () {
                $(this).find("p").text("Você está sobre a caixa!");
            },
            function () {
                $(this).find("p").text("Passe o mouse");
            }
        );
    </script>
</body>
</html>
