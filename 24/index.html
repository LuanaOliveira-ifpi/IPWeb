<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Atividade 24</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="title bg-light text-center">
            <h1>SELECIONANDO ELEMENTOS COM JQUERY</h1>
        </div>

        <hr />

        <div class="row">
            <div class="col-md-4">
                <h4>Parágrafos</h4>
            </div>
            <div class="col-md-4">
                <h4>Divisões</h4>
            </div>
            <div class="col-md-4">
                <h4>Campos</h4>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <p class="bg-primary">Este é um parágrafo</p>
                <p class="bg-success">Este é outro parágrafo</p>
            </div>

            <div class="col-md-4">
                <div style="background:#428bca;" class="caixa"></div>
                <div style="background:#5cb85c;" class="caixa"></div>
            </div>

            <div class="col-md-4">
                <input id="campo1" type="text" placeholder="input ID 01" class="form-control mt-3" />
                <input id="campo2" type="text" placeholder="input ID 02" class="form-control mt-3" />
            </div>
        </div>
        <hr />

        <div class="row">
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('p', 'tag', false)">Esconder parágrafos</button>
                <button type="button" class="btn btn-success" onclick="exibirOcultarGenerica('p', 'tag', true)">Exibir parágrafos</button>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('caixa', 'classe', false)">Esconder divs</button>
                <button type="button" class="btn btn-success" onclick="exibirOcultarGenerica('caixa', 'classe', true)">Exibir divs</button>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('campo1', 'id', false)">Esconder input ID 1</button>
                <button type="button" class="btn btn-danger" onclick="exibirOcultarGenerica('campo2', 'id', false)">Esconder input ID 2</button>
                <button type="button" class="btn btn-success mt-3" onclick="exibirOcultarGenerica('campo1', 'id', true)">Exibir input ID 1</button>
                <button type="button" class="btn btn-success mt-3" onclick="exibirOcultarGenerica('campo2', 'id', true)">Exibir input ID 2</button>
            </div>
        </div>   

        <div class="container mt-5">
            <div class="title bg-light text-center">
                <h1>EVENTOS COM JQUERY</h1>
            </div>

            <div class="row justify-content-between mt-4 g-3">
                <div class="col-auto">
                    <div class="box bg-white border rounded" id="elemento">
                        <p class="text-center">Caixa 1</p>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="box bg-info border rounded" id="box">
                        <p class="text-center">Caixa 2</p>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="box bg-secondary border rounded" id="clickBox">
                        <p class="text-center">Caixa 3</p>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="box bg-success border rounded" id="doubleClickMsg">
                        <p class="text-center">Caixa 4</p>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="box bg-warning border rounded" id="hoverBox">
                        <p class="text-center">Passe o mouse</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.6/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/javascript">
        // Função para esconder ou mostrar elementos genéricos
        function exibirOcultarGenerica(selector, tipo, flag) {
            if (tipo === 'tag') {
                $(selector).toggle(flag);
            } else if (tipo === 'classe') {
                $('.' + selector).toggle(flag);
            } else if (tipo === 'id') {
                $('#' + selector).toggle(flag);
            }
        }

        // Eventos das caixas
        $("#elemento").click(function () {
            $(this).toggle("slow");
        });

        $("#box").click(function () {
            $(this).toggleClass("bg-info bg-danger");
        });

        $("#clickBox").click(function () {
            $(this).text("Clique detectado!");
        });

        $("#doubleClickMsg").dblclick(function () {
            $(this).text("Duplo Clique Detectado!");
        });

        $("#hoverBox").hover(
            function () {
                $(this).find("p").text("Você está sobre a caixa!");
            },
            function () {
                $(this).find("p").text("Passe o mouse");
            }
        );
    </script>
</body>
</html>
