<!DOCTYPE html>
<html>
<head>
    <title>Atividade 19</title>
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #d2d2d3;
        }

        .profile-card {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .text-primary {
            color: #007bff;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .color-blue {
            color: #007bff;
        }

        .row-separator {
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h2>User Profile</h2>
                <div class="profile-card border-top border-4 border-primary">
                    <img src="https://assets.mubicdn.net/images/artworks/46441/images-original.png?1621543415" class="profile-img img-fluid" alt="Profile Image">
                    <h3>Amelie Poulin</h3>
                    <p class="text-muted">Cinéfila</p>
                    <hr>
                    <div class="row row-separator">
                        <div class="col-md-9 text-start color-blue">
                            <strong>Followers</strong>  
                        </div>
                        <div class="col-md-3 text-end text-primary">
                            <p>1,322</p>
                        </div>    
                    </div>
                    <div class="row row-separator">
                        <div class="col-md-9 text-start">
                            <strong>Following</strong> 
                        </div>
                        <div class="col-md-3 text-end text-primary">
                            <p>543</p>
                        </div>     
                    </div>
                    <div class="row">
                        <div class="col-md-9 text-start">
                            <strong>Friends</strong> 
                        </div>
                        <div class="col-md-3 text-end text-primary">
                            <p>13,287</p>
                        </div>     
                    </div>
                    <button class="btn btn-primary btn-lg d-block w-100">Follow</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
