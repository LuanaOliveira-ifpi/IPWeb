<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 22</title>
  
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
   
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <script src="script.js" defer></script>
    
    <style>
        .modal-body {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>JavaScript</h1>

        <!-- Contagem de 1 a n -->
        <h2>Contagem de 1 a n</h2>
        <button class="btn btn-primary" onclick="escreverNumeros()">Contar até n</button>
        <div id="resultado" class="mt-3"></div> 

        <hr>

    
        <h2>Calculadora de Raiz Quadrada</h2>
        <a href="#" onclick="calcularRaiz(25); return false;">Raiz de 25</a><br>
        <a href="#" onclick="calcularRaiz(36); return false;">Raiz de 36</a><br>
        <a href="#" onclick="calcularRaiz(49); return false;">Raiz de 49</a><br>

        <hr>

  
        <h2>Exibir Texto em Modal</h2>
        <button class="btn btn-info" onclick="mostrarModal()">Escreva um texto</button>

        <div class="modal fade" id="meuModal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalLabel">Texto do Modal</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body" id="modalBody">
                       
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
